name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Ao enviar uma tag vX.Y.Z, publica uma release com o APK anexado.
      - name: Preparar APK da release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "AutoClicker-${GITHUB_REF_NAME}.apk"

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoClicker ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: AutoClicker-${{ github.ref_name }}.apk
