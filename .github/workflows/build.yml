name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release automática: lê a versão (versionName) do app e, se existir
      # release-notes/vX.Y.Z.md e a release ainda não existir, publica uma
      # nova com o APK anexado. A tag é criada pelo próprio GitHub.
      - name: Verificar se há release nova
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -f "release-notes/${TAG}.md" ] && ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/debug/app-debug.apk "AutoClicker-${TAG}.apk"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AutoClicker ${{ steps.ver.outputs.tag }}
          body_path: release-notes/${{ steps.ver.outputs.tag }}.md
          files: AutoClicker-${{ steps.ver.outputs.tag }}.apk
